<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMÉA | Sign In to Your Skincare Account</title>
  <meta name="description" content="Sign in to your LUMÉA personal account to view saved routines, favorite formulas, and customized skin goals.">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page-wrapper">

  <main class="py-4 py-md-5 my-auto">
    <div class="container">
      <!-- Minimal Auth Header -->
      <div class="row justify-content-center mb-4">
        <div class="col-lg-11 d-flex justify-content-between align-items-center">
          <a href="index.html" class="brand-logo" aria-label="LUMÉA Skincare">
            <span class="logo-icon-wrapper">
              <svg class="logo-drop-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2.5C12 2.5 5.5 11 5.5 15.5C5.5 19.09 8.41 22 12 22C15.59 22 18.5 19.09 18.5 15.5C18.5 11 12 2.5 12 2.5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 22V13C12 11.5 13.5 10 15 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="logo-text">LUMÉA<span class="logo-dot">.</span></span>
          </a>
          <a href="index.html" class="btn-lumea btn-lumea-outline btn-lumea-sm">
            <i class="bi bi-arrow-left me-1"></i> Back to Home
          </a>
        </div>
      </div>

      <div class="row justify-content-center align-items-center g-5">
        <div class="col-lg-5">
          <div class="card p-4 p-md-5 border-0 shadow-card rounded-4 bg-surface">
            <span class="eyebrow mb-2">Welcome Back</span>
            <h2 class="heading-1 mb-4">Sign In</h2>

            <!-- Social Authentication Icons -->
            <div class="social-auth-buttons mb-3">
              <button type="button" class="btn-social-auth" onclick="showToast('Connecting Google account...');">
                <i class="bi bi-google"></i> Google
              </button>
              <button type="button" class="btn-social-auth" onclick="showToast('Connecting Apple ID...');">
                <i class="bi bi-apple"></i> Apple
              </button>
              <button type="button" class="btn-social-auth" onclick="showToast('Connecting Facebook account...');">
                <i class="bi bi-facebook"></i> Facebook
              </button>
            </div>

            <div class="auth-divider">
              <span>Or Sign In With Email</span>
            </div>
            
            <form id="login-form">
              <div class="form-group-lumea">
                <label class="form-label-lumea">Email Address</label>
                <input type="email" id="login-email" class="form-control-lumea" placeholder="name@example.com" value="demouser@lumea.com" required>
              </div>

              <div class="form-group-lumea">
                <label class="form-label-lumea">Password</label>
                <div class="password-input-group">
                  <input type="password" id="login-password" class="form-control-lumea" placeholder="••••••••" value="password123" required>
                  <button type="button" class="btn-toggle-password" aria-label="Toggle password visibility">
                    <i class="bi bi-eye-slash"></i>
                  </button>
                </div>
              </div>

              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="remember-me" checked>
                  <label class="form-check-label small text-muted" for="remember-me">Remember me</label>
                </div>
                <a href="#" class="small text-muted" onclick="event.preventDefault(); showToast('Demo environment: Enter any password.');">Forgot password?</a>
              </div>

              <button type="submit" class="btn-lumea btn-lumea-primary w-100 py-3 mb-3">Sign In <i class="bi bi-arrow-right"></i></button>

              <div class="text-center small text-muted">
                Don't have an account? <a href="register.html" class="fw-semibold text-dark">Create Account</a>
              </div>
            </form>
          </div>
        </div>

        <div class="col-lg-6 d-none d-lg-block">
          <div class="img-hover-wrapper rounded-4 overflow-hidden shadow-card" style="height: 520px;">
            <img src="assets/images/18.jpg" alt="LUMÉA Login Auth Side Banner">
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
